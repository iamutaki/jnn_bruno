info:
  name: REGISTER
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/v1/device/register"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "udid": "a",
        "fcmToken": "bb"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
