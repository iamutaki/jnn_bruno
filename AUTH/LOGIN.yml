info:
  name: LOGIN
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "iamutaki",
        "password": "23Cacing09#@"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            const body = res.getBody();
            
            // Pastikan data dan accessToken memang ada di dalam response body
            if (body && body.data && body.data.accessToken) {
                bru.setEnvVar("accessToken", body.data.accessToken);
            }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
