info:
  name: CHANGE_PASSWORD
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{host}}/v1/profile/change-password"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "oldPassword": "current123",
        "newPassword": "new456",
        "confirmNewPassword": "new456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
